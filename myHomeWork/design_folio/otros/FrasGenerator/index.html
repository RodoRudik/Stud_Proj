<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
    <!--Generador de frases motivacionales 
    que cambia al hacer click en boton-->
    <section id="fondo">
        <!--contenedor principal-->
        <div class="container">
            <h2 class="frase"></h2><!--elemento para mostrar la frase -->        
            <p class="author"></p><!--elemento para mostrar el autor --> 
        </div> 
        <div class="button-container">
            <button class="creation">Nueva frase</button>
            <button class="favorite">favorito</button>
            <button class="copiar">Copiar</button>
            <small id="contador">Vistas: 0</small><!--contar las cantidades de vistas-->
        </div>
    </section>   
    
    <script src="./script.js"></script>
</body>
</html>
